services:

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
    - MINIO_ROOT_USER=minioadmin
    - MINIO_ROOT_PASSWORD=minioadmin
    - MINIO_ACCESS_KEY=AGENTS
    - MINIO_SECRET_ACCESS_KEY=AGENTS@123456
    - MINIO-BUCKET=bitlabs
    command: server --console-address ":9001" /data
    restart: always
    volumes:
    - minio_storage:/data

volumes:
  minio_storage:
